<!DOCTYPE html>
<html>
<head>
    <title>AI Help Bot</title>

</head>
<body>

<h2>Crime Help Bot</h2>

<div class="chatbox">
    <p><b>Bot:</b> Ask me anything related to crime reporting.</p>
</div>

<input type="text" id="question" placeholder="Type your question">
<button onclick="reply()">Ask</button>

<script>
function reply() {
    let q = document.getElementById("question").value;
    alert("Bot: Please contact nearest police station for urgent cases.");
}
</script>

</body>
</html>
